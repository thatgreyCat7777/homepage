<!doctype html>

<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
            crossorigin="anonymous"
        />
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
            crossorigin="anonymous"
        ></script>
        <link href="css/navbar.css" rel="stylesheet" />
        <link href="css/cards.css" rel="stylesheet" />
        <link href="css/slides.css" rel="stylesheet" />
        <link href="" rel="stylesheet" class="slides-light-dark"/>
        <link href="" rel="stylesheet" class="cards-light-dark" />
        <link
            rel="icon"
            href="https://avatars.githubusercontent.com/u/151648110?v=4"
        />
        <script src="js/navbar.js"></script>
        <script src="js/cats.js"></script>
        <title>Cats!</title>
    </head>

    <body>
        <header>
            <div id="navbar-placeholder"></div>
        </header>
        <main>
            <!-- Slides start -->
            <div id="carouselExampleCaptions" class="carousel slide">
                <!-- * First Slide -->
                <div class="carousel-inner">
                    <div class="carousel-item">
                        <img
                            src=""
                            class="d-block w-100"
                            alt="Cats!"
                            id="cats-img"
                        />
                    </div>
                    <div class="carousel-item">
                        <img
                            src=""
                            class="d-block w-100"
                            alt="Cats!"
                            id="cats-img"
                        />
                    </div>
                    <div class="carousel-item">
                        <img
                            src=""
                            class="d-block w-100"
                            alt="Cats!"
                            id="cats-img"
                        />
                    </div>
                    <div class="carousel-item active">
                        <img
                            src=""
                            class="d-block w-100"
                            alt="Cats!"
                            id="cats-img"
                        />
                    </div>
                    <div class="carousel-item">
                        <img
                            src=""
                            class="d-block w-100"
                            alt="Cats!"
                            id="cats-img"
                        />
                    </div>
                    <div class="carousel-item">
                        <img
                            src=""
                            class="d-block w-100"
                            alt="Cats!"
                            id="cats-img"
                        />
                    </div>
                    <div class="carousel-item">
                        <img
                            src=""
                            class="d-block w-100"
                            alt="Cats!"
                            id="cats-img"
                        />
                    </div>
                </div>
                <!-- * Last Slide -->
                <!-- * Navigation Buttons -->
                <button
                    class="carousel-control-prev get-cat-btn"
                    type="button"
                    data-bs-target="#carouselExampleCaptions"
                    data-bs-slide="prev"
                    id="previous"
                >
                    <span
                        class="carousel-control-prev-icon"
                        aria-hidden="true"
                    ></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button
                    class="carousel-control-next get-cat-btn"
                    type="button"
                    data-bs-target="#carouselExampleCaptions"
                    data-bs-slide="next"
                    id="next"
                >
                    <span
                        class="carousel-control-next-icon"
                        aria-hidden="true"
                    ></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </main>
    </body>
</html>
